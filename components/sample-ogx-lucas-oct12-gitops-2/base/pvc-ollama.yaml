# Persistent storage for Ollama models
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/instance: sample-ogx-lucas-oct12-gitops-2-ollama
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: sample-ogx-lucas-oct12-gitops-2-ollama-data
    app.kubernetes.io/part-of: sample-ogx-lucas-oct12-gitops-2
    app.kubernetes.io/component: ollama
  name: sample-ogx-lucas-oct12-gitops-2-ollama-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Ollama models can be large (llama-guard3:8b ~5GB)
      storage: 20Gi
