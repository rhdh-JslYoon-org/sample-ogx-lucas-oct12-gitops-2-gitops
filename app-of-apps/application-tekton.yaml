apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sample-ogx-lucas-oct12-gitops-2-app-tekton
  namespace: rhdh-app
  finalizers: ["resources-finalizer.argocd.argoproj.io"]
spec:
  project: default
  source:
    path: ./components/sample-ogx-lucas-oct12-gitops-2/overlays/tekton
    repoURL: https://github.com/rhdh-JslYoon-org/sample-ogx-lucas-oct12-gitops-2-gitops.git
    targetRevision: main
  destination:
    namespace: rhdh-app
    server: https://kubernetes.default.svc
  syncPolicy:
    managedNamespaceMetadata:
      labels:
        argocd.argoproj.io/managed-by: rhdh-app
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
